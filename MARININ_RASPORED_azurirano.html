<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marinin školski rokovnik</title>
<style>
:root{--ink:#263238;--line:#aeb7bd;--paper:#fffdf7;--muted:#68737b;--accent:#365f7a;--a:#edf4f8;--b:#f5f0e8}
*{box-sizing:border-box}
body{margin:0;background:#eef1f2;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:1100px;margin:auto;padding:16px}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;margin:0;font-weight:700}
.controls{display:flex;gap:8px;align-items:center}
button,select{font:inherit;border:1px solid #b8c1c6;border-radius:10px;background:white;padding:9px 11px;color:var(--ink)}
button{cursor:pointer}
.month-title{font-size:18px;font-weight:700;margin:10px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:0 2px 10px #0000000d}
.grid{display:grid;grid-template-columns:34px repeat(7,minmax(116px,1fr));min-width:850px}
.head{font-weight:700;text-align:center;font-size:12px;padding:10px 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#f4f5f3}
.head:last-child{border-right:0}
.label{font-size:20px;font-weight:800;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.label.a{background:var(--a)} .label.b{background:var(--b)}
.cell{min-height:156px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:5px}
.cell:nth-child(8n){border-right:0}
.date{font-size:12px;color:var(--muted);font-weight:700}
.time{font-size:13px;line-height:1.3;white-space:pre-line;font-weight:650;color:rgba(180,55,55,.58);background:rgba(220,100,100,.055);border-radius:5px;padding:2px 3px}
.note{flex:1;min-height:78px;width:100%;border:0;border-top:1px dashed #c6cdd1;background:transparent;resize:none;outline:none;padding:8px 2px 2px;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.note::placeholder{color:#a2abb0}
.empty{background:#f7f7f4}.today{background:rgba(220,55,55,.08);border:2px solid rgba(180,55,55,.65);border-radius:8px}.date.today-date{color:#b33b3b;font-weight:800}
.hint{font-size:12px;color:var(--muted);margin:10px 2px 18px}
@media(max-width:600px){
 body{background:#f7f8f7}.app{padding:10px}
 header{align-items:flex-start}.controls{width:100%}.controls select{flex:1}
 h1{font-size:19px}.month-title{font-size:16px}
 .table-wrap{border-radius:10px}
 .grid{min-width:0;grid-template-columns:24px repeat(7,minmax(0,1fr))}
 .head{font-size:10px;padding:8px 1px;word-break:break-word}
 .label{font-size:16px;padding-top:10px}
 .cell{min-height:145px;padding:5px;gap:4px}
 .date{font-size:10px}.time{font-size:10px;line-height:1.25;color:rgba(180,55,55,.58);background:rgba(220,100,100,.055);border-radius:4px;padding:2px}
 .note{font-size:12px;min-height:76px;padding:5px 1px}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

const MONTH_NAMES = ["", "Siječanj", "Veljača", "Ožujak", "Travanj", "Svibanj", "Lipanj", "Srpanj", "Kolovoz", "Rujan", "Listopad", "Studeni", "Prosinac"];
const DAYS = ["PON","UTO","SRI","ČET","PET","SUB","NED"];
const keys = Object.keys(DATA);
const now = new Date();
const currentKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
let idx = Math.max(0, keys.indexOf(currentKey));
const grid = document.getElementById("grid");
const select = document.getElementById("month");
keys.forEach((key,i)=>{
  const o=document.createElement("option"); o.value=i; o.textContent=MONTH_NAMES[DATA[key].month]+" "+DATA[key].year; select.appendChild(o);
});
function noteKey(date){return "marina-note-"+date}
function getNote(date){
  if (Object.prototype.hasOwnProperty.call(remoteNotes, date)) return remoteNotes[date] || "";
  return localStorage.getItem(noteKey(date)) || "";
}
function saveNote(date, value){
  localStorage.setItem(noteKey(date), value);
  clearTimeout(pendingWrites[date]);
  pendingWrites[date] = setTimeout(() => {
    notesRef.child(date).set(value).catch(err => console.error("Firebase spremanje nije uspjelo:", err));
  }, 350);
}
function render(){
  idx = Math.max(0,Math.min(keys.length-1,idx));
  select.value=idx;
  const obj=DATA[keys[idx]];
  document.getElementById("monthTitle").textContent=MONTH_NAMES[obj.month]+" "+obj.year;
  grid.innerHTML="";
  const corner=document.createElement("div"); corner.className="head"; corner.textContent=""; grid.appendChild(corner);
  DAYS.forEach(d=>{const x=document.createElement("div");x.className="head";x.textContent=d;grid.appendChild(x)});
  obj.weeks.forEach(week=>{
    const wt=(week.find(c=>c)?.week_type)||"";
    const lab=document.createElement("div");lab.className="label "+(wt==="A"?"a":"b");lab.textContent=wt;grid.appendChild(lab);
    week.forEach(cell=>{
      const box=document.createElement("div");box.className="cell"+(!cell?" empty":"");
      if(cell){
        const isToday = cell.date === `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
         if(isToday) box.classList.add("today");
         const date=document.createElement("div");date.className="date"+(isToday?" today-date":"");date.textContent=cell.day+"."+obj.month+".";box.appendChild(date);
        const time=document.createElement("div");time.className="time";time.textContent=cell.schedule||"";box.appendChild(time);
        const note=document.createElement("textarea");note.className="note";note.dataset.date=cell.date;note.placeholder="Upiši obavezu…";note.value=getNote(cell.date);
        note.addEventListener("focus",()=>{editingDate=cell.date;});
note.addEventListener("input",()=>saveNote(cell.date,note.value));
note.addEventListener("blur",()=>{if(editingDate===cell.date) editingDate=null;});
        box.appendChild(note);
      }
      grid.appendChild(box);
    });
  });
}
select.addEventListener("change",()=>{idx=Number(select.value);render()});
document.getElementById("prev").addEventListener("click",()=>{idx--;render()});
document.getElementById("next").addEventListener("click",()=>{idx++;render()});
render();
notesRef.on("value", snapshot => {
  remoteNotes = snapshot.val() || {};
  document.querySelectorAll("textarea.note[data-date]").forEach(note => {
    if (editingDate !== note.dataset.date && document.activeElement !== note) {
      const value = getNote(note.dataset.date);
      if (note.value !== value) note.value = value;
    }
  });
});
